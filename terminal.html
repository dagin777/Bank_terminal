<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Симулятор терминала</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:system-ui,sans-serif;color:#e2e8f0;background:#0f172a}
.s{display:none}.s.on{display:flex}
.c{min-height:100vh;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:20px}
.card{width:min(420px,92vw);background:#1e293b;border-radius:20px;padding:28px;box-shadow:0 20px 50px #0008;text-align:left}
h1{margin:0 0 14px;font-size:22px}label{font-size:13px;color:#94a3b8}
input,select{width:100%;margin:6px 0 16px;padding:14px;font-size:20px;border-radius:12px;border:1px solid #334155;background:#0f172a;color:#fff}
button{width:100%;padding:16px;font-size:18px;font-weight:600;border:0;border-radius:12px;background:#22c55e;color:#04210f;cursor:pointer;margin-top:8px}
button.alt{background:#334155;color:#e2e8f0}button:disabled{background:#334155;color:#64748b;cursor:not-allowed}
.code{font-size:44px;font-weight:800;letter-spacing:8px;text-align:center;margin:10px 0 18px;color:#22c55e}
.st{display:flex;align-items:center;gap:8px;font-size:14px;color:#94a3b8;margin-bottom:16px}
.dot{width:10px;height:10px;border-radius:50%;background:#ef4444}.dot.on{background:#22c55e;box-shadow:0 0 8px #22c55e}
#log,#perr{margin-top:14px;font-size:14px;color:#94a3b8;min-height:18px}
/* экраны терминала */
.t{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;color:#fff;user-select:none}
.t.on{display:flex}#idle,#proc{background:#0f172a}#pay{background:#16a34a}#ok{background:#15803d}
.sm{opacity:.85;font-size:18px}.amt{font-size:14vw;font-weight:800;margin:12px 0}
.hint{position:absolute;bottom:8vh;opacity:.8;animation:b 1.4s infinite}@keyframes b{50%{opacity:.3}}
.ring{width:90px;height:90px;border:8px solid #334155;border-top-color:#22c55e;border-radius:50%;animation:r 1s linear infinite;margin-bottom:28px}
@keyframes r{to{transform:rotate(360deg)}}
.chk{width:120px;height:120px;border-radius:50%;background:#fff;display:grid;place-items:center;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(0)}}
.chk svg{width:70px;stroke:#16a34a;stroke-width:7;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:d .5s .3s forwards}
@keyframes d{to{stroke-dashoffset:0}}h2{font-size:28px;margin:24px 0 4px}
</style></head><body>

<!-- Выбор роли -->
<div class="s c on" id="role"><div class="card">
  <h1>💳 Симулятор терминала</h1>
  <button id="bPc">Это компьютер (касса)</button>
  <button class="alt" id="bPhone">Это телефон (терминал)</button>
</div></div>

<!-- ПК -->
<div class="s c" id="pc"><div class="card">
  <h1>💳 Касса (ПК)</h1>
  <label>Код для телефона:</label><div class="code" id="code">····</div>
  <div class="st"><span class="dot" id="dot"></span><span id="stt">Ожидание телефона…</span></div>
  <label>Сумма</label><input id="amount" type="number" min="0" step="0.01" placeholder="0.00" inputmode="decimal">
  <label>Валюта</label>
  <select id="cur">
    <option value="RUB">₽ RUB — рубль</option><option value="USD">$ USD — доллар</option><option value="EUR">€ EUR — евро</option>
    <option value="GBP">£ GBP — фунт</option><option value="KZT">₸ KZT — тенге</option><option value="UAH">₴ UAH — гривна</option>
    <option value="BYN">Br BYN — бел. рубль</option><option value="CNY">¥ CNY — юань</option><option value="TRY">₺ TRY — лира</option>
  </select>
  <button id="go" disabled>Вывести на терминал</button><div id="log"></div>
</div></div>

<!-- Телефон: ввод кода -->
<div class="s c" id="join"><div class="card">
  <h1>📱 Терминал (телефон)</h1>
  <label>Введи код с экрана ПК</label>
  <input id="codeIn" inputmode="numeric" maxlength="4" placeholder="0000">
  <button id="bConn">Подключиться</button><div id="perr"></div>
</div></div>

<!-- Телефон: экраны терминала -->
<div class="t" id="idle"><div class="sm">💳 Терминал готов</div><div class="sm">Подключено к ПК ✓</div></div>
<div class="t" id="pay"><div class="sm">К оплате</div><div class="amt" id="a1"></div><div class="hint">Коснитесь экрана</div></div>
<div class="t" id="proc"><div class="ring"></div><h2 id="ptxt">Обработка платежа…</h2><div class="sm" id="a2"></div></div>
<div class="t" id="ok">
  <div class="chk"><svg viewBox="0 0 52 52"><path d="M12 27l10 10 18-20"/></svg></div>
  <h2>Покупка успешна</h2><div class="sm" id="a3"></div><div class="hint">Коснитесь, чтобы закрыть</div>
</div>

<script>
const $ = id => document.getElementById(id);
const SYM = {RUB:'₽',USD:'$',EUR:'€',GBP:'£',KZT:'₸',UAH:'₴',BYN:'Br',CNY:'¥',TRY:'₺'};
const PFX = 'tsim-';
const screen = id => document.querySelectorAll('.s').forEach(s => s.classList.toggle('on', s.id === id));
const tscreen = id => document.querySelectorAll('.t').forEach(s => s.classList.toggle('on', s.id === id));

$('bPc').onclick = startPc;
$('bPhone').onclick = () => screen('join');

/* ---------- ПК ---------- */
let peer, conn;
function startPc() {
  screen('pc');
  const code = String(Math.floor(1000 + Math.random() * 9000));
  peer = new Peer(PFX + code);
  peer.on('open', () => $('code').textContent = code);
  peer.on('error', e => {
    if (e.type === 'unavailable-id') { peer.destroy(); startPc(); }
    else $('stt').textContent = 'Ошибка: ' + e.type;
  });
  peer.on('connection', c => {
    conn = c;
    c.on('open', () => setConn(true));
    c.on('close', () => setConn(false));
    c.on('data', d => {
      if (d.type === 'result') $('log').textContent = `✅ Оплачено: ${d.amount} ${d.currency}`;
    });
  });
}
function setConn(on) {
  $('dot').classList.toggle('on', on);
  $('stt').textContent = on ? 'Телефон подключён' : 'Телефон отключился';
  $('go').disabled = !on;
}
$('go').onclick = () => {
  const a = parseFloat($('amount').value);
  if (!(a > 0)) { $('log').textContent = 'Введите сумму больше 0'; return; }
  conn.send({type:'pay', amount:a.toFixed(2), currency:$('cur').value});
  $('log').textContent = '⏳ Ожидание оплаты на терминале…';
};

/* ---------- Телефон ---------- */
let cur = null, busy = false;
$('bConn').onclick = () => {
  const code = $('codeIn').value.trim();
  if (code.length !== 4) { $('perr').textContent = 'Введите 4 цифры'; return; }
  $('perr').textContent = 'Подключение…';
  if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{});
  peer = new Peer();
  peer.on('open', () => {
    conn = peer.connect(PFX + code, {reliable:true});
    conn.on('open', () => { screen('none'); tscreen('idle'); });
    conn.on('data', onPay);
    conn.on('close', () => { tscreen('none'); screen('join'); $('perr').textContent = 'Связь с ПК потеряна'; });
  });
  peer.on('error', e => {
    $('perr').textContent = e.type === 'peer-unavailable' ? 'Код не найден. Проверь цифры.' : 'Ошибка: ' + e.type;
  });
};
function onPay(d) {
  if (d.type !== 'pay') return;
  cur = d; busy = false;
  const t = `${d.amount} ${SYM[d.currency] || d.currency}`;
  $('a1').textContent = $('a2').textContent = $('a3').textContent = t;
  tscreen('pay');
  if (navigator.vibrate) navigator.vibrate(200);
}
$('pay').onclick = () => {
  if (busy || !cur) return; busy = true;
  tscreen('proc');
  const steps = ['Обработка платежа…', 'Связь с банком…', 'Подтверждение…']; let i = 0;
  const iv = setInterval(() => $('ptxt').textContent = steps[++i % 3], 900);
  setTimeout(() => {
    clearInterval(iv); tscreen('ok');
    conn.send({type:'result', status:'success', amount:cur.amount, currency:cur.currency});
    if (navigator.vibrate) navigator.vibrate([80, 60, 80]);
  }, 2800);
};
$('ok').onclick = () => { cur = null; busy = false; tscreen('idle'); };
</script>
</body></html>
